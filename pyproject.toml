[build-system]
requires = ["hatchling>=1.31"]
build-backend = "hatchling.build"

[project]
name = "opendocs-sdk"
version = "0.1.0"
description = "Convert local documents to Markdown"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "OpenDocs contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
    "litellm>=1.93,<2",
    "pdf-inspector>=0.2.6",
    "pdfplumber>=0.11.10,<0.12",
    "pillow>=12.3,<13",
    "python-docx>=1.1.2,<2",
    "python-pptx>=1.0.2,<2",
]

[project.urls]
Repository = "https://github.com/caichuanwang/OpenDocs"
Issues = "https://github.com/caichuanwang/OpenDocs/issues"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "ruff>=0.16",
  "ty>=0.0.63",
]

[tool.hatch.build.targets.wheel]
packages = ["src/opendocs"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.github",
  "/.omx",
  "/.serena",
  "/AGENTS.md",
  "/benchmarks/document_parsing/manifest.local.json",
  "/benchmarks/document_parsing/private",
  "/benchmarks/document_parsing/runs",
  "/tests/corpus",
  "/tests/corpus.local.toml",
  "/tests/m1-replay.local",
  "/tests/m2-acceptance.local",
  "/tests/m2-replay.local",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
