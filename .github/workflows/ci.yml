name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --all-groups --frozen
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Run Ruff
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Run ty
        run: uv run --frozen ty check src tests
      - name: Check patch whitespace
        run: git diff --check
      - name: Build distributions
        run: rm -rf dist && uv build
      - name: Verify installed wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name 'opendocs_sdk-*.whl' -print -quit)"
          test -n "$wheel" && test -f "$wheel"
          wheel_env="$RUNNER_TEMP/opendocs-wheel"
          python -m venv "$wheel_env"
          "$wheel_env/bin/pip" install "$wheel"
          "$wheel_env/bin/python" - <<'PY'
          import asyncio
          from importlib.metadata import metadata

          from opendocs import ParseOptions, VisionConfig, aparse, parse

          assert metadata("opendocs-sdk")["Name"] == "opendocs-sdk"
          assert parse(b"hello") == "hello\n"
          assert asyncio.run(aparse(b"hello")) == "hello\n"
          ParseOptions()
          VisionConfig(model="openai/vision-model")
          PY
