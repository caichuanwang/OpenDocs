name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poppler on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Poppler on macOS
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Sync locked dependencies
        run: uv sync --all-groups --frozen
      - name: Run tests
        run: uv run --frozen pytest -q
      - name: Run Ruff
        run: uv run --frozen ruff check .
      - name: Check formatting
        run: uv run --frozen ruff format --check .
      - name: Run ty
        run: uv run --frozen ty check src tests benchmarks scripts examples
      - name: Check patch whitespace
        run: git diff --check

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build checked distributions
        run: |
          uv build
          uv run --frozen python scripts/check_release_artifacts.py dist
      - name: Upload checked distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  artifact-smoke:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poppler on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Poppler on macOS
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist
      - name: Verify checksums and artifact contracts
        run: python scripts/check_release_artifacts.py dist --verify-checksums
      - name: Smoke wheel and source distribution independently
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          python -m venv "$RUNNER_TEMP/wheel-env"
          "$RUNNER_TEMP/wheel-env/bin/pip" install "$wheel"
          "$RUNNER_TEMP/wheel-env/bin/python" scripts/release_smoke.py \
            "$RUNNER_TEMP/wheel-smoke" --version 0.1.0
          python -m venv "$RUNNER_TEMP/sdist-env"
          "$RUNNER_TEMP/sdist-env/bin/pip" install "$sdist"
          "$RUNNER_TEMP/sdist-env/bin/python" scripts/release_smoke.py \
            "$RUNNER_TEMP/sdist-smoke" --version 0.1.0
