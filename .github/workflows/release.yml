name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Poppler
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Validate tag, version, master ancestry, and evidence
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$GITHUB_REF_NAME" = "v$package_version"
          git fetch --no-tags origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master
          parent_count="$(git cat-file -p "$GITHUB_SHA" | grep -c '^parent ')"
          test "$parent_count" -eq 1
          candidate_commit="$(git rev-parse "$GITHUB_SHA^")"
          evidence="docs/releases/v${package_version}-evidence.md"
          test "$evidence" = "docs/releases/v0.1.0-evidence.md"
          test -f "$evidence"
          mapfile -t changed_paths < <(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")
          test "${#changed_paths[@]}" -eq 1
          test "${changed_paths[0]}" = "$evidence"
          grep -Fx "Candidate commit: $candidate_commit" "$evidence"
      - name: Run release gates
        run: |
          uv sync --all-groups --frozen
          uv run --frozen pytest -q
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen ty check src tests benchmarks scripts examples
          git diff --check
      - name: Build and inspect once
        run: |
          uv build
          uv run --frozen python scripts/check_release_artifacts.py dist
      - name: Upload immutable release distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dists
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  testpypi:
    runs-on: ubuntu-latest
    needs: build
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist
      - name: Verify downloaded distributions
        run: python scripts/check_release_artifacts.py dist --verify-checksums
      - name: Stage only publishable files
        run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
      - name: Publish to TestPyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: publish/
      - name: Smoke exact TestPyPI version
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/testpypi-env"
          for attempt in {1..12}; do
            if "$RUNNER_TEMP/testpypi-env/bin/pip" download \
              --no-deps --only-binary=:all: \
              --index-url https://test.pypi.org/simple/ \
              --dest "$RUNNER_TEMP/testpypi-dist" \
              opendocs-sdk==0.1.0; then
              break
            fi
            test "$attempt" -lt 12
            sleep 10
          done
          testpypi_wheel="$(find "$RUNNER_TEMP/testpypi-dist" -name '*.whl' -print -quit)"
          python - "$testpypi_wheel" dist/SHA256SUMS <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          wheel = Path(sys.argv[1])
          expected = {
              line.split("  ", 1)[1]: line.split("  ", 1)[0]
              for line in Path(sys.argv[2]).read_text(encoding="ascii").splitlines()
          }
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == expected[wheel.name]
          PY
          "$RUNNER_TEMP/testpypi-env/bin/pip" install "$testpypi_wheel"
          "$RUNNER_TEMP/testpypi-env/bin/python" scripts/release_smoke.py \
            "$RUNNER_TEMP/testpypi-smoke" --version 0.1.0

  pypi:
    runs-on: ubuntu-latest
    needs: [build, testpypi]
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist
      - name: Verify downloaded distributions
        run: python scripts/check_release_artifacts.py dist --verify-checksums
      - name: Stage only publishable files
        run: |
          mkdir publish
          cp dist/*.whl dist/*.tar.gz publish/
      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: publish/

  public-smoke:
    runs-on: ${{ matrix.os }}
    needs: pypi
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Poppler on Ubuntu
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes poppler-utils
      - name: Install Poppler on macOS
        if: runner.os == 'macOS'
        run: brew install poppler
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
      - name: Download release checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist
      - name: Verify downloaded distributions
        run: python scripts/check_release_artifacts.py dist --verify-checksums
      - name: Download exact public wheel and verify identity
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/public-env"
          for attempt in {1..12}; do
            if "$RUNNER_TEMP/public-env/bin/pip" download \
              --no-deps --only-binary=:all: \
              --index-url https://pypi.org/simple \
              --dest "$RUNNER_TEMP/public-dist" \
              opendocs-sdk==0.1.0; then
              break
            fi
            test "$attempt" -lt 12
            sleep 10
          done
          public_wheel="$(find "$RUNNER_TEMP/public-dist" -name '*.whl' -print -quit)"
          python - "$public_wheel" dist/SHA256SUMS <<'PY'
          import hashlib
          import sys
          from pathlib import Path

          wheel = Path(sys.argv[1])
          expected = {
              line.split("  ", 1)[1]: line.split("  ", 1)[0]
              for line in Path(sys.argv[2]).read_text(encoding="ascii").splitlines()
          }
          assert hashlib.sha256(wheel.read_bytes()).hexdigest() == expected[wheel.name]
          PY
          "$RUNNER_TEMP/public-env/bin/pip" install "$public_wheel"
          "$RUNNER_TEMP/public-env/bin/python" scripts/release_smoke.py \
            "$RUNNER_TEMP/public-smoke" --version 0.1.0

  github-release:
    runs-on: ubuntu-latest
    needs: [build, public-smoke]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download checked distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dists
          path: dist
      - name: Verify downloaded distributions
        run: python scripts/check_release_artifacts.py dist --verify-checksums
      - name: Create GitHub Release for the verified public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/*.whl dist/*.tar.gz dist/SHA256SUMS \
            --verify-tag \
            --title "OpenDocs $GITHUB_REF_NAME" \
            --notes-file docs/releases/v0.1.0-notes.md
